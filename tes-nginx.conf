# Configuración específica para tes.105pos.pro para arreglar el SSL expirado
server {
    server_name tes.105pos.pro;
    set $subdomain "tes";
    
    # Frontend estático - DEBE IR PRIMERO
    root /var/www/105pos/dist;
    index index.html;
    
    # Permitir cargas grandes (logos, banners, etc.)
    client_max_body_size 50M;

    # Logs específicos para tenants
    access_log /var/log/nginx/105pos_tes_access.log;
    error_log /var/log/nginx/105pos_tes_error.log;
    
    # WhatsApp Server
    location /api/whatsapp/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Id $subdomain;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # API Laravel
    location /api/ {
        client_max_body_size 50M;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Storage de Laravel (imágenes de productos, avatares, etc.)
    location ^~ /storage/ {
        alias /var/www/105pos/backend/public/storage/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Assets estáticos - cachear y servir directamente
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Frontend - catch-all para Vue Router (DEBE IR AL FINAL)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SSL con certificado específico
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tes.105pos.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tes.105pos.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS para el subdominio
server {
    listen 80;
    listen [::]:80;
    server_name tes.105pos.pro;
    return 301 https://$host$request_uri;
}
