name: 🚀 Deploy 105 POS Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 📋 Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Production
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} "cd /var/www/105pos && \
            echo '🔄 Iniciando deploy...' && \
            git pull origin main && \
            echo '📦 Installing Composer dependencies...' && \
            cd backend && \
            composer install --no-dev --optimize-autoloader --no-interaction && \
            echo '🗄️ Running migrations...' && \
            php artisan migrate --force || echo '⚠️ Algunas migraciones fallaron, continuando...' && \
            echo '🧹 Clearing cache...' && \
            php artisan config:clear && \
            php artisan cache:clear && \
            php artisan route:clear && \
            php artisan view:clear && \
            echo '♻️ Optimizing...' && \
            php artisan config:cache && \
            php artisan route:cache && \
            php artisan view:cache && \
            echo '🔐 Setting permissions...' && \
            chmod -R 755 storage bootstrap/cache && \
            chown -R www-data:www-data storage bootstrap/cache && \
            echo '🎨 Building frontend...' && \
            cd .. && \
            npm install && \
            npm run build && \
            echo '🔄 Restarting PHP-FPM...' && \
            sudo systemctl restart php8.2-fpm && \
            echo '✅ Deploy completed successfully!'"

      - name: ✅ Deployment Status
        if: success()
        run: |
          echo "🎉 Deployment to ${{ secrets.VPS_HOST }} completed successfully!"
          echo "🌐 Application: https://105pos.pro"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "💥 Deployment failed! Check logs above for details."
          exit 1
