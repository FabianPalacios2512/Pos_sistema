name: 🚀 Deploy 105 POS Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 🎨 Build Frontend
        run: |
          echo '🎨 Building frontend locally...'
          npm ci
          npm run build
          echo '✅ Frontend build completed!'

      - name: 🔐 Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 📋 Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Deploy Frontend to VPS
        run: |
          echo '📤 Uploading frontend build to VPS...'
          rsync -avz --delete dist/ ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/105pos/dist/
          echo '✅ Frontend uploaded!'

      - name: 🚀 Deploy Backend to Production
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} "cd /var/www/105pos && \
            echo '🔄 Iniciando backend deploy...' && \
            git config --global credential.helper store && \
            echo 'https://${{ secrets.GH_TOKEN }}@github.com' > ~/.git-credentials && \
            git fetch origin main && \
            git reset --hard origin/main && \
            git clean -fd && \
            echo '📦 Installing Composer dependencies...' && \
            cd backend && \
            composer install --no-dev --optimize-autoloader --no-interaction && \
            echo '🗄️ Running migrations...' && \
            php artisan migrate --force || echo '⚠️ Algunas migraciones fallaron, continuando...' && \
            echo '🧹 Clearing ALL cache...' && \
            php artisan config:clear && \
            php artisan cache:clear && \
            php artisan route:clear && \
            php artisan view:clear && \
            php artisan optimize:clear && \
            echo '♻️ Rebuilding cache...' && \
            php artisan config:cache && \
            php artisan route:cache && \
            php artisan view:cache && \
            echo '📋 Verifying routes...' && \
            php artisan route:list | grep 'web-catalog' || echo '⚠️ web-catalog routes not found in cache' && \
            echo '🔐 Setting permissions...' && \
            chmod -R 755 storage bootstrap/cache || true && \
            chown -R www-data:www-data storage bootstrap/cache || true && \
            echo '🔄 Restarting PHP-FPM...' && \
            sudo systemctl restart php8.3-fpm || sudo systemctl restart php-fpm || true && \
            rm ~/.git-credentials && \
            echo '✅ Deploy completed successfully!'"

      - name: ✅ Deployment Status
        if: success()
        run: |
          echo "🎉 Deployment to ${{ secrets.VPS_HOST }} completed successfully!"
          echo "🌐 Application: https://105pos.pro"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "💥 Deployment failed! Check logs above for details."
          exit 1
