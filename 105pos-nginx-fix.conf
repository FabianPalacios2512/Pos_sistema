server {
    server_name 105pos.pro www.105pos.pro;
    
    # Logs
    access_log /var/log/nginx/105pos_access.log;
    error_log /var/log/nginx/105pos_error.log;

    # Root para archivos estáticos del frontend
    root /var/www/105pos/dist;
    index index.html;

    # ✅ Storage de Laravel (imágenes de productos, etc.)
    location ^~ /storage/ {
        alias /var/www/105pos/backend/public/storage/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Assets del frontend Vue.js
    location /assets/ {
        alias /var/www/105pos/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Archivos estáticos del frontend
    location ~* ^/(.*\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|map|webmanifest))$ {
        root /var/www/105pos/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service Worker y PWA
    location ~* ^/(sw\.js|workbox.*\.js|registerSW\.js|manifest\.webmanifest)$ {
        root /var/www/105pos/dist;
        add_header Cache-Control "no-cache";
    }

    # ✅ Admin API - Rewrite /admin/api/* to /api/admin/api/* for Laravel
    location ^~ /admin/api/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        
        fastcgi_param SCRIPT_FILENAME /var/www/105pos/backend/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api$request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/105pos/backend;
        
        # Timeouts para requests largos
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_connect_timeout 60s;
    }

    # ✅ Backend Laravel API
    location ^~ /api/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        
        fastcgi_param SCRIPT_FILENAME /var/www/105pos/backend/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/105pos/backend;
        
        # Timeouts para requests largos (AI, subida de archivos)
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_connect_timeout 60s;
    }

    # WhatsApp Multi-Tenant Server
    location ^~ /whatsapp/ {
        proxy_pass http://localhost:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # Frontend Vue.js (SPA) - todas las rutas van a index.html
    location / {
        root /var/www/105pos/dist;
        try_files $uri $uri/ /index.html;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/105pos.pro-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/105pos.pro-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name 105pos.pro www.105pos.pro;
    return 301 https://$host$request_uri;
}
